name: CI

on:
  push:
    branches: [main, master, HMTT]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install HMTT and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e HMTT/
          pip install -r HMTT/requirements.txt
          pip install pytest flake8

      - name: Lint (syntax errors and undefined names only)
        run: |
          flake8 HMTT/ src/ --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run HMTT unit tests
        run: pytest tests/test_hmtt.py -v

      - name: Import smoke test
        run: |
          python -c "
          from HMTT.preprocessing.partitioner import TextPartitioner
          from HMTT.preprocessing.math_tokenizer import MathTokenizer
          from HMTT.preprocessing.code_tokenizer import CodeTokenizer
          from HMTT.preprocessing.nl_tokenizer import NLTokenizer
          from HMTT.evaluation.tfs_metric import TFSEvaluator
          print('HMTT imports OK')
          "
